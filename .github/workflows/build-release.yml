name: Build My Player RELEASE APK (faster)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle
      - name: Use fixed signing key if present
        run: |
          if [ -f .ci/debug.keystore ]; then
            mkdir -p ~/.android
            cp .ci/debug.keystore ~/.android/debug.keystore
          fi
      - name: Add swap space
        continue-on-error: true
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-player-release-apk
          path: app/build/outputs/apk/github/release/*arm64-v8a*.apk
          retention-days: 30
